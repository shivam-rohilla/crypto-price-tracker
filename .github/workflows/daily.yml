name: Daily Crypto Price Tracker

on:
  schedule:
    - cron: "30 1 * * *"   # Runs daily at 07:00 IST
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch crypto prices
        run: python scripts/fetch_crypto.py

      - name: Commit and push if changed
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update BTC & ETH prices (INR)"
            git push
          fi
